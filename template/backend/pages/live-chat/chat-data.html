<div class="card-header">
    <h4>Chat with Admin User</h4>
</div>
<div class="card-body chat-content"
     id="chatBody"
     tabindex="2"
     style="height: 400px; overflow-y: auto; outline: none; background: #f8f9fa;">

            <div class="chat-item chat-right" style=""><img
                    src="Admin User">
                <div class="chat-details">
                    <div class="chat-text">Sample</div>
                    <div class="chat-time">Sample</div>
                </div>
            </div>
        
            <div class="chat-item chat-left" style=""><img
                    src="Admin User">
                <div class="chat-details">
                    <div class="chat-text">Sample</div>
                    <div class="chat-time">Sample</div>
                </div>
            </div>

</div>
<div class="card-footer chat-form">
    <form id="chat-form">
        <input type="hidden" class="form-control" id="receiver_id" name="receiver_id" value="Admin User">
        <input type="text" class="form-control" id="message" name="message" placeholder="Type a message">
        <button class="btn btn-primary" type="button">
            <i class="far fa-paper-plane"></i>
        </button>
    </form>
</div>
